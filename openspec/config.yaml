context: |
  This is a React, Next.js, Node.js and TypeScript AI Agent application.

  Technology:
  - React
  - Next.js
  - Node.js
  - TypeScript with strict mode
  - LangChain.js
  - LangGraph.js
  - OpenAI models
  - Zod for runtime validation
  - Vitest for automated tests

  Architecture:
  - Agents are implemented under app/agents
  - MCP Servers are implemented under app/mcp
  - LangGraph state definitions are under app/graph
  - External configuration is loaded from environment variables
  - Secrets must never be committed to source control

  Engineering requirements:
  - Add unit tests for new business logic
  - Mock LLM and external tool calls in unit tests
  - Preserve existing public interfaces where possible
  - Run npm test, npm run lint, and npm run build before completion